proxy_cache_path /var/cache/nginx/gf_tiles levels=1:2 keys_zone=gf_tiles_cache:64m inactive=30m use_temp_path=off;

server {
  listen 80;
  server_name _;

  location /gf-tiles/ {
    proxy_pass https://gis95.yskc.com/server/rest/services/%E9%AB%98%E5%88%86%E5%BD%B1%E5%83%8F/GF_2024_YM/MapServer/tile/;
    proxy_set_header Host gis95.yskc.com;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name gis95.yskc.com;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Headers * always;
    proxy_cache gf_tiles_cache;
    proxy_cache_valid 200 302 10m;
    proxy_cache_valid 404 1m;
  }
}
