server {
    listen 3004;
    server_name _;

    # 前端静态文件根目录
    root /home/server/python/map_assistant_v1/frontend/build;
    index index.html;

    # WebSocket 反代
    location /ws/ {
        proxy_pass http://127.0.0.1:8006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SSE 流式接口（禁用缓冲）
    location /chat/stream {
        proxy_pass http://127.0.0.1:8006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 后端 API 反代（注意：不包含 /static/，前端静态资源用那个路径）
    location ~ ^/(api|chat|sessions|suggestions|tiles|mvt)(/|$) {
        proxy_pass http://127.0.0.1:8006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # 报告下载接口（明确匹配 /api/download/report/）
    location /api/download/report/ {
        proxy_pass http://127.0.0.1:8006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # 后端报告文件（/static/ 由后端提供，和前端 /static/ 路径冲突，用 /api-static/ 区分）
    # 如需访问后端 static，请使用 http://IP:8006/static/

    # SPA 兜底：其余路径先找本地文件，找不到返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
