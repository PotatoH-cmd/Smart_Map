document:
  name: "信阳市水利局项目总结报告"
  language: zh

# =========================
# ① 非正文剥离规则
# =========================
remove_blocks:
  - pattern: "^#\\s*目\\s*录"
  - pattern: "^目\\s*录"
  - pattern: "^#\\s*信阳市水利局"
  - pattern: "^本报告用于"
  - pattern: "^页码"
  - pattern: "^第\\s*\\d+\\s*页"
  - pattern: "^—{3,}$"

# =========================
# ② 标题层级规则（⚠️ 注意：必须有 pattern）
# =========================
headings:
  chapter:
    pattern: "^(一|二|三|四|五|六|七|八|九|十)、.+"
  section:
    pattern: "^\\d+\\.\\d+\\s+.+"
  subsection:
    pattern: "^（\\d+）.+|^\\(\\d+\\).+"

# =========================
# ③ 行政区标签
# =========================
regions:
  - 浉河区
  - 平桥区
  - 固始县
  - 光山县
  - 潢川县
  - 淮滨县
  - 新县
  - 商城县
  - 罗山县
  - 息县
  - 信阳市

# =========================
# ④ 河流关键词
# =========================
rivers:
  - 淮河
  - 潢河
  - 史灌河
  - 灌河
  - 沙河
  - 竹竿河
  - 小潢河
  - 浉河

# =========================
# ⑤ 段落切分控制
# =========================
paragraph:
  min_length: 120
  max_length: 800
  split_keywords:
    - 同时
    - 此外
    - 另外
    - 其中
    - 对此
    - 综上

# =========================
# ⑥ 图表识别
# =========================
figures:
  pattern: "^图\\s*\\d+(?:[\\.-]\\d+)?"

tables:
  pattern: "^表\\s*\\d+(?:[\\.-]\\d+)?"

# =========================
# ⑦ 附表 / 附录处理
# =========================
appendix:
  pattern: "^附表|^附录"
  vectorize: false

# =========================
# ⑧ 通用清洗选项
# =========================
cleanup:
  remove_html: true
  merge_broken_units: true
  remove_empty_lines: true
